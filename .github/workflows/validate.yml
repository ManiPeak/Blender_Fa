name: Validate prototype

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    name: Patch and documentation checks (not a Blender build)
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate source patch metadata and repository links
        run: python3 scripts/validate_patch.py
      - name: Run project static tests
        run: python3 -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python3 -m compileall -q scripts tests
